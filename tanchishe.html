<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --snake: #4ade80;
      --snake-head: #86efac;
      --food: #f87171;
      --text: #e2e8f0;
      --accent: #fbbf24;
      --muted: #94a3b8;
      --border: #3b3b5c;
      --overlay-bg: rgba(10, 10, 20, 0.8);
      --btn-primary-fg: #0b1f12;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      --bg-glow: rgba(129, 140, 248, 0.16);
    }

    /* 浅色主题 */
    [data-theme="light"] {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --snake: #16a34a;
      --snake-head: #22c55e;
      --food: #ef4444;
      --text: #0f172a;
      --accent: #d97706;
      --muted: #64748b;
      --border: #cbd5e1;
      --overlay-bg: rgba(255, 255, 255, 0.85);
      --btn-primary-fg: #ffffff;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.10);
      --bg-glow: rgba(148, 163, 184, 0.22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1100px 520px at 50% -8%, var(--bg-glow), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      transition: background 0.3s ease, color 0.3s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .score {
      margin: 0 0 12px;
      font-size: 1.15rem;
    }

    .score span {
      color: var(--accent);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .validity {
      margin: 0 0 12px;
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .validity.valid { color: var(--snake); border-color: var(--snake); }
    .validity.invalid { color: var(--food); border-color: var(--food); }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 424px;
      padding: 12px;
    }

    .stage {
      position: relative;
    }

    canvas {
      display: block;
      width: 400px;
      max-width: 100%;
      height: auto;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--overlay-bg);
      border-radius: 8px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--accent);
    }

    .overlay-title.danger { color: var(--food); }
    .overlay-title.success { color: var(--snake); }

    .overlay-sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .overlay-buttons {
      display: flex;
      gap: 10px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      padding: 8px 18px;
      min-height: 44px;
      min-width: 44px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, border-color 0.15s, transform 0.06s, box-shadow 0.15s;
    }

    .btn:hover { border-color: var(--muted); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:active { transform: none; }

    .btn-primary {
      background: var(--snake);
      color: var(--btn-primary-fg);
      font-weight: 700;
      border-color: var(--snake);
      box-shadow: 0 2px 10px rgba(74, 222, 128, 0.35);
    }
    .btn-primary:hover {
      background: var(--snake-head);
      border-color: var(--snake-head);
    }

    .hidden { display: none; }

    /* 历史最高分列表 */
    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .history-rank {
      color: var(--muted);
      min-width: 1.8em;
      text-align: right;
    }

    .history-score {
      color: var(--accent);
      font-weight: 700;
    }

    .history-win {
      color: var(--snake);
      font-size: 0.75rem;
    }

    .history-time {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* 历史得分弹窗 */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--overlay-bg);
    }

    .modal.hidden { display: none; }

    .modal-box {
      width: 100%;
      max-width: 360px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .modal-close {
      padding: 2px 10px;
      min-height: 0;
      font-size: 1.1rem;
      line-height: 1.4;
    }

    .history-scroll {
      overflow-y: auto;
      max-height: 50vh;
      padding-right: 4px;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* 右侧设置面板 */
    .layout {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      padding: 12px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 220px;
      max-width: 260px;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .panel-title {
      margin: 0;
      font-size: 1.1rem;
    }

    .panel-desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .panel-range {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper-buttons {
      display: flex;
      gap: 6px;
    }

    .stepper-buttons .btn-step {
      flex: 1;
      min-width: 0;
    }

    .btn-step {
      padding: 6px 12px;
      font-size: 1.1rem;
      min-width: 40px;
    }

    .stepper-input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      font-size: 1rem;
      text-align: center;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      -moz-appearance: textfield;
    }

    .stepper-input::-webkit-outer-spin-button,
    .stepper-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .preset {
      flex: 1;
      min-width: 40px;
      padding: 6px 8px;
      font-size: 0.85rem;
    }

    /* 移动端 / 窄屏优化：游戏主体置顶，面板下移并占满可用宽度 */
    @media (max-width: 900px) {
      .layout { gap: 16px; padding: 8px; }
      .game { order: -1; }
      .panel { width: 100%; min-width: 0; max-width: 340px; }
    }
  </style>
</head>
<body>
  <div class="layout">
  <aside class="panel" aria-label="历史最高分">
    <h2 class="panel-title">历史最高分</h2>
    <ol id="history-top" class="history-list"></ol>
    <p class="panel-desc hidden" id="history-empty">暂无记录，赢一局试试吧</p>
    <button class="btn" id="btn-history-all">查看全部</button>
  </aside>
  <div class="game">
    <h1>贪吃蛇</h1>
    <div class="score">当前分数：<span id="score">0</span></div>
    <p class="validity valid" id="score-validity">本局成绩有效</p>

    <div class="stage">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" id="overlay-title">贪吃蛇</div>
        <div class="overlay-sub" id="overlay-sub">方向键 / WASD 移动，或滑动屏幕</div>
        <div class="overlay-buttons">
          <button class="btn btn-primary" id="btn-primary">开始游戏</button>
          <button class="btn" id="btn-restart">重新开始</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-pause">暂停</button>
      <button class="btn" id="btn-restart-bar">重新开始</button>
      <button class="btn" id="btn-theme">主题：深色</button>
      <button class="btn" id="btn-ai">AI 演示：关</button>
    </div>

    <p class="hint">滑动屏幕或方向键 / WASD 移动 · Esc 暂停 · 空格开始</p>
  </div>

  <aside class="panel" aria-label="胜利目标设置">
    <h2 class="panel-title">胜利目标</h2>
    <p class="panel-desc">得分达到该值即获胜</p>
    <div class="stepper">
      <input class="stepper-input" id="win-input" type="number" aria-label="胜利目标分数">
    </div>
    <div class="stepper-buttons">
      <button class="btn btn-step" id="btn-win-dec5" aria-label="目标减5分">-5</button>
      <button class="btn btn-step" id="btn-win-dec1" aria-label="目标减1分">-1</button>
      <button class="btn btn-step" id="btn-win-inc1" aria-label="目标加1分">+1</button>
      <button class="btn btn-step" id="btn-win-inc5" aria-label="目标加5分">+5</button>
    </div>
    <div class="presets">
      <button class="btn preset" data-win="20">20</button>
      <button class="btn preset" data-win="50">50</button>
      <button class="btn preset" data-win="100">100</button>
      <button class="btn preset" data-win="200">200</button>
      <button class="btn preset" data-win="397">397</button>
    </div>
    <p class="panel-range">范围 1 ~ 397 · 默认 397</p>
  </aside>
  </div>

  <div class="modal hidden" id="history-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>历史得分</h3>
        <button class="btn modal-close" id="btn-history-close" aria-label="关闭">×</button>
      </div>
      <ol id="history-full" class="history-list history-scroll"></ol>
      <button class="btn" id="btn-history-clear">清空记录</button>
    </div>
  </div>

  <script>
    // ===== 网格与画布 =====
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const CELL = 20;             // 每格像素
    const COLS = canvas.width / CELL;   // 20
    const ROWS = canvas.height / CELL;  // 20

    // 画布颜色字面量（Canvas 的 fillStyle/strokeStyle 不支持 CSS 变量 var()）
    // gridAlt 为棋盘格交替色；snake/snakeTail 为蛇身头→尾渐变的起止色；head 为蛇头主色。
    const COLORS = {
      gridAlt: '#1c2544',
      snake: '#4ade80',
      snakeTail: '#15803d',
      head: '#86efac',
      food: '#f87171',
      foodLight: '#fca5a5',
      foodGlow: 'rgba(248, 113, 113, 0.35)',
    };

    // ===== DOM 元素 =====
    const scoreEl = document.getElementById('score');
    const validityEl = document.getElementById('score-validity');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const btnPrimary = document.getElementById('btn-primary');
    const btnRestart = document.getElementById('btn-restart');
    const btnRestartBar = document.getElementById('btn-restart-bar');
    const btnPause = document.getElementById('btn-pause');
    const btnTheme = document.getElementById('btn-theme');
    const btnAi = document.getElementById('btn-ai');
    const winInputEl = document.getElementById('win-input');
    const btnWinDec5 = document.getElementById('btn-win-dec5');
    const btnWinDec1 = document.getElementById('btn-win-dec1');
    const btnWinInc1 = document.getElementById('btn-win-inc1');
    const btnWinInc5 = document.getElementById('btn-win-inc5');
    const historyTopEl = document.getElementById('history-top');
    const historyFullEl = document.getElementById('history-full');
    const historyEmptyEl = document.getElementById('history-empty');
    const btnHistoryAll = document.getElementById('btn-history-all');
    const btnHistoryClose = document.getElementById('btn-history-close');
    const btnHistoryClear = document.getElementById('btn-history-clear');
    const historyModal = document.getElementById('history-modal');

    // ===== 蛇的数据结构：坐标数组，[0] 为蛇头 =====
    let snake = [
      { x: 9, y: 10 }, // 蛇头
      { x: 8, y: 10 },
      { x: 7, y: 10 },
    ];

    // ===== 方向控制 =====
    let direction = { x: 1, y: 0 };   // 当前移动方向（向右）
    const directionQueue = [];         // 输入缓冲，元素形如 { x, y, at }
    const MAX_QUEUE = 3;               // 队列最大长度，超出丢弃最旧
    const QUEUE_TIMEOUT = 500;         // 预输入超时（毫秒），超时即丢弃

    const KEY_DIRS = {
      ArrowUp:    { x: 0, y: -1 },
      ArrowDown:  { x: 0, y: 1 },
      ArrowLeft:  { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 },
    };

    // 将转向指令入队（含反向保护、长度限制）
    function queueDirection(next) {
      // 反向保护：新方向不能与“队尾（或当前方向）”相反
      const last = directionQueue.length
        ? directionQueue[directionQueue.length - 1]
        : direction;
      if (last.x + next.x === 0 && last.y + next.y === 0) return;

      // 长度限制：队列已满则丢弃本次输入，而非丢弃队头。
      // 若丢弃队头，会破坏「队头与当前方向不反向」的不变量，导致原地掉头撞入身体。
      if (directionQueue.length >= MAX_QUEUE) return;

      directionQueue.push({ x: next.x, y: next.y, at: Date.now() });
    }

    // ===== 食物 =====
    let food = { x: 15, y: 10 };

    // ===== 计分 =====
    let score = 0;

    // ===== 游戏状态：ready | running | paused | over =====
    let state = 'ready';
    let timer = null;
    const SPEED = 150; // 每步间隔（毫秒），后续可随分数递减
    let gameUsedAi = false; // 本局是否曾处于 AI 模式（沾过即作废，用于成绩判定）

    // ===== 输入处理 =====
    document.addEventListener('keydown', (e) => {
      // 方向键 / WASD
      const next = KEY_DIRS[e.key] || KEY_DIRS[e.key.toLowerCase()];
      if (next) {
        e.preventDefault(); // 阻止页面滚动
        // 仅在运行中接收方向输入，暂停/结束/就绪期间丢弃
        if (state === 'running' && !aiMode) queueDirection(next);
      }
      // 空格：开始 / 重新开始（ready / over / win 时）
      if (e.key === ' ') {
        e.preventDefault();
        if (state === 'ready' || state === 'over' || state === 'win') start();
      }
      // Esc：暂停 / 继续
      if (e.key === 'Escape') {
        e.preventDefault();
        if (!historyModal.classList.contains('hidden')) {
          historyModal.classList.add('hidden');
        } else {
          togglePause();
        }
      }
    });

    // ===== 触控输入（滑动转向） =====
    let touchStart = null;

    canvas.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (!touchStart) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      touchStart = null;

      // 低于阈值视为点击，不转向
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;

      // 取位移更大的轴向，换算成方向向量
      const next = Math.abs(dx) > Math.abs(dy)
        ? { x: Math.sign(dx), y: 0 }
        : { x: 0, y: Math.sign(dy) };

      if (state === 'running' && !aiMode) queueDirection(next);
    });

    // ===== 开始 / 重新开始 =====
    function start() {
      if (timer) clearInterval(timer);
      snake = [
        { x: 9, y: 10 },
        { x: 8, y: 10 },
        { x: 7, y: 10 },
      ];
      direction = { x: 1, y: 0 };
      directionQueue.length = 0;
      gameUsedAi = false;
      renderValidity();
      score = 0;
      updateScore();
      state = 'running';
      spawnFood();
      draw();
      timer = setInterval(step, SPEED);
      renderState();
    }

    // ===== 暂停 / 继续 =====
    function pause() {
      if (state !== 'running') return;
      state = 'paused';
      clearInterval(timer);
      timer = null;
      renderState();
    }

    function resume() {
      if (state !== 'paused') return;
      state = 'running';
      timer = setInterval(step, SPEED);
      renderState();
    }

    function togglePause() {
      if (state === 'running') pause();
      else if (state === 'paused') resume();
    }

    // ===== 每步更新 =====
    function step() {
      if (state !== 'running') return;

      // 丢弃超时的预输入（队头最旧，逐个弹出直到新鲜）
      const now = Date.now();
      while (directionQueue.length && now - directionQueue[0].at > QUEUE_TIMEOUT) {
        directionQueue.shift();
      }

      if (aiMode) {
        // AI 演示：每步由 AI 重新决策，忽略键盘/触控输入
        gameUsedAi = true; // 本局曾使用 AI，成绩作废
        renderValidity();
        const next = aiNextDir();
        if (next) direction = next;
        directionQueue.length = 0;
      } else {
        // 消费前跳过与当前方向相反的指令（防御：超时清理可能残留反向队头）
        while (directionQueue.length) {
          const head = directionQueue[0];
          if (head.x + direction.x === 0 && head.y + direction.y === 0) {
            directionQueue.shift();
          } else {
            break;
          }
        }
        if (directionQueue.length) {
          // 取出下一个转向指令
          const next = directionQueue.shift();
          direction = { x: next.x, y: next.y };
        }
      }

      // 计算新蛇头
      const head = snake[0];
      const newHead = { x: head.x + direction.x, y: head.y + direction.y };

      // 撞墙判定
      if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
        return gameOver();
      }

      const ate = newHead.x === food.x && newHead.y === food.y;

      // 未吃到食物时，尾部会被移除；先移除尾部再判自撞，避免误判
      if (!ate) snake.pop();

      // 撞自身判定
      if (snake.some((seg) => seg.x === newHead.x && seg.y === newHead.y)) {
        return gameOver();
      }

      // 移动：新蛇头插入头部
      snake.unshift(newHead);

      // 吃到食物：加分（蛇尾已保留，实现增长）
      if (ate) {
        score++;
        updateScore();
        // 得分达到目标分 → 胜利
        if (score >= winScore) return win();
        spawnFood();
      }

      draw();
    }

    // ===== 食物生成（随机空白格） =====
    function spawnFood() {
      const occupied = new Set(snake.map((s) => `${s.x},${s.y}`));
      if (occupied.size >= COLS * ROWS) return; // 蛇占满网格（胜利），无空位可生成
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (occupied.has(`${pos.x},${pos.y}`));
      food = pos;
    }

    // ===== 更新分数显示 =====
    function updateScore() {
      scoreEl.textContent = score;
    }

    // 本局成绩有效性提示（依据 gameUsedAi）
    function renderValidity() {
      const valid = !gameUsedAi;
      validityEl.textContent = valid ? '本局成绩有效' : '本局成绩无效（已使用 AI 演示）';
      validityEl.classList.toggle('valid', valid);
      validityEl.classList.toggle('invalid', !valid);
    }

    // ===== 游戏结束 =====
    function gameOver() {
      state = 'over';
      clearInterval(timer);
      timer = null;
      draw();
      recordScore(score, 'over');
      renderState();
    }

    // ===== 胜利 =====
    function win() {
      state = 'win';
      clearInterval(timer);
      timer = null;
      draw();
      recordScore(score, 'win');
      renderState();
    }

    // ===== 胜利目标（可配置，按得分计） =====
    const WIN_MIN = 1;               // 最小目标分（吃到 1 个食物即达标）
    const WIN_MAX = COLS * ROWS - 3; // 可达成上限：填满地图时的最大得分（400 格 - 初始 3 节）
    const WIN_DEFAULT = WIN_MAX;     // 默认：填满地图
    let winScore = WIN_DEFAULT;

    function clampWin(n) {
      return Math.min(WIN_MAX, Math.max(WIN_MIN, Math.round(n)));
    }

    function setWinScore(n) {
      winScore = clampWin(n);
      winInputEl.value = winScore;
      saveWinScore();
    }

    function loadWinScore() {
      try { return parseInt(localStorage.getItem('snake-win'), 10); }
      catch { return NaN; }
    }

    function saveWinScore() {
      try { localStorage.setItem('snake-win', String(winScore)); }
      catch { /* 存储不可用时静默失败 */ }
    }

    // ===== 历史得分记录 =====
    const HISTORY_MAX = 100;       // 存储上限（条）
    let history = loadHistory();

    function loadHistory() {
      try {
        const raw = localStorage.getItem('snake-history');
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr)
          ? arr.filter((r) => r && typeof r.score === 'number' && typeof r.ts === 'number')
          : [];
      } catch { return []; }
    }

    function saveHistory() {
      try { localStorage.setItem('snake-history', JSON.stringify(history)); }
      catch { /* 存储不可用时静默失败 */ }
    }

    function recordScore(finalScore, result) {
      if (gameUsedAi) return;      // 本局曾使用 AI，成绩作废
      if (finalScore <= 0) return; // 0 分（及异常值）不记录
      history.push({ score: finalScore, ts: Date.now(), result });
      history.sort((a, b) => b.score - a.score || b.ts - a.ts); // 分数降序，同分新在前
      if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
      saveHistory();
      renderHistory();
    }

    function formatTime(ts) {
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function historyItemEl(rank, r) {
      const li = document.createElement('li');
      li.className = 'history-item';

      const rankEl = document.createElement('span');
      rankEl.className = 'history-rank';
      rankEl.textContent = `#${rank}`;

      const scoreEl = document.createElement('span');
      scoreEl.className = 'history-score';
      scoreEl.textContent = `${r.score} 分`;

      const timeEl = document.createElement('span');
      timeEl.className = 'history-time';
      timeEl.textContent = formatTime(r.ts);

      li.append(rankEl, scoreEl, timeEl);
      if (r.result === 'win') {
        const winEl = document.createElement('span');
        winEl.className = 'history-win';
        winEl.textContent = '胜';
        li.appendChild(winEl);
      }
      return li;
    }

    function renderHistory() {
      const top = history.slice(0, 10);
      historyTopEl.innerHTML = '';
      top.forEach((r, i) => historyTopEl.appendChild(historyItemEl(i + 1, r)));

      historyEmptyEl.classList.toggle('hidden', history.length > 0);
      btnHistoryAll.disabled = history.length === 0;

      historyFullEl.innerHTML = '';
      history.forEach((r, i) => historyFullEl.appendChild(historyItemEl(i + 1, r)));
    }

    // ===== AI 演示（搜索 bot：BFS 寻路 + 存活启发式）=====
    let aiMode = false;

    // BFS 最短路径 from -> to；obstacles 为不可通过的坐标集合（键 "x,y"）
    function bfs(from, to, obstacles) {
      const targetKey = `${to.x},${to.y}`;
      const start = { x: from.x, y: from.y };
      if (`${start.x},${start.y}` === targetKey) return [start];
      const queue = [[start]];
      const visited = new Set([`${start.x},${start.y}`]);
      while (queue.length) {
        const path = queue.shift();
        const cur = path[path.length - 1];
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cur.x + dx, ny = cur.y + dy;
          if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          const key = `${nx},${ny}`;
          if (visited.has(key) || obstacles.has(key)) continue;
          const np = path.concat([{ x: nx, y: ny }]);
          if (key === targetKey) return np;
          visited.add(key);
          queue.push(np);
        }
      }
      return null;
    }

    // 洪水填充：统计从 from 出发可达的空格数（obstacles 视为不可通过）
    function floodFill(from, obstacles) {
      const visited = new Set();
      const stack = [[from.x, from.y]];
      let count = 0;
      while (stack.length) {
        const [cx, cy] = stack.pop();
        const key = `${cx},${cy}`;
        if (visited.has(key) || obstacles.has(key)) continue;
        visited.add(key);
        count++;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          stack.push([nx, ny]);
        }
      }
      return count;
    }

    // 模拟沿 foodPath 走到底后，蛇头是否仍能连通到蛇尾（防止自围）
    function safeToFollow(foodPath) {
      const sim = snake.map((s) => ({ x: s.x, y: s.y }));
      for (let i = 1; i < foodPath.length; i++) {
        const n = foodPath[i];
        sim.unshift({ x: n.x, y: n.y });
        const ate = n.x === food.x && n.y === food.y;
        if (!ate) sim.pop();
      }
      const head = sim[0];
      const tail = sim[sim.length - 1];
      const obstacles = new Set(sim.slice(0, -1).map((s) => `${s.x},${s.y}`));
      return !!bfs(head, tail, obstacles);
    }

    function dirFromTo(a, b) {
      return { x: Math.sign(b.x - a.x), y: Math.sign(b.y - a.y) };
    }

    // 兜底：无安全路径时，选「剩余可达空间最大」的一步
    function bestOpenSpaceMove() {
      const head = snake[0];
      const body = new Set(snake.slice(0, -1).map((s) => `${s.x},${s.y}`)); // 尾部视为空位
      let best = null, bestSpace = -1;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (dx + direction.x === 0 && dy + direction.y === 0) continue; // 禁止反向
        const nx = head.x + dx, ny = head.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        if (body.has(`${nx},${ny}`)) continue;
        const space = floodFill({ x: nx, y: ny }, body);
        if (space > bestSpace) { bestSpace = space; best = { x: dx, y: dy }; }
      }
      return best;
    }

    // 每步决策：返回下一步方向 {x,y}；无解返回 null
    function aiNextDir() {
      const head = snake[0];
      const tail = snake[snake.length - 1];
      const obstacles = new Set(snake.slice(0, -1).map((s) => `${s.x},${s.y}`)); // 尾部视为空位

      // 1) 优先：安全地吃到食物
      const foodPath = bfs(head, food, obstacles);
      if (foodPath && foodPath.length > 1 && safeToFollow(foodPath)) {
        return dirFromTo(head, foodPath[1]);
      }

      // 2) 次选：跟随蛇尾绕圈，等待机会
      const tailPath = bfs(head, tail, obstacles);
      if (tailPath && tailPath.length > 1) {
        return dirFromTo(head, tailPath[1]);
      }

      // 3) 兜底：选剩余空间最大的一步
      return bestOpenSpaceMove();
    }

    // ===== 根据状态刷新遮罩层与按钮 =====
    function renderState() {
      overlayTitle.classList.toggle('danger', state === 'over');
      overlayTitle.classList.toggle('success', state === 'win');

      if (state === 'ready') {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = '贪吃蛇';
        overlaySub.textContent = '方向键 / WASD 移动，或滑动屏幕';
        btnPrimary.textContent = '开始游戏';
        btnPrimary.classList.remove('hidden');
        btnRestart.classList.add('hidden');
        btnPause.textContent = '暂停';
        btnPause.disabled = true;
      } else if (state === 'running') {
        overlay.classList.add('hidden');
        btnPause.textContent = '暂停';
        btnPause.disabled = false;
      } else if (state === 'paused') {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = '已暂停';
        overlaySub.textContent = '按 Esc 或点击按钮继续';
        btnPrimary.textContent = '继续游戏';
        btnPrimary.classList.remove('hidden');
        btnRestart.classList.remove('hidden');
        btnPause.textContent = '继续';
        btnPause.disabled = false;
      } else if (state === 'over') {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = '游戏结束';
        overlaySub.textContent = `得分：${score} 分`;
        btnPrimary.classList.add('hidden');
        btnRestart.classList.remove('hidden');
        btnPause.textContent = '暂停';
        btnPause.disabled = true;
      } else if (state === 'win') {
        overlay.classList.remove('hidden');
        overlayTitle.textContent = '胜利！';
        overlaySub.textContent = `得分达到目标 ${winScore} 分，本局得分 ${score} 分`;
        btnPrimary.classList.add('hidden');
        btnRestart.classList.remove('hidden');
        btnPause.textContent = '暂停';
        btnPause.disabled = true;
      }
    }

    // ===== 绘制 =====
    function draw(now = performance.now()) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 棋盘格底纹：隔格交替，弱化网格线感、强化格位可读性
      ctx.fillStyle = COLORS.gridAlt;
      for (let y = 0; y < ROWS; y++) {
        for (let x = y % 2; x < COLS; x += 2) {
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }

      drawFood(now);
      drawSnake();
    }

    // 圆角矩形路径（手动 arcTo 实现，避免依赖 ctx.roundRect 的兼容性）
    function roundedRectPath(x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 食物：呼吸脉动 + 径向渐变 + 高光，营造「果实」质感
    function drawFood(now) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const pulse = 1 + 0.1 * Math.sin(now / 280);
      const r = (CELL / 2 - 2) * pulse;

      // 光晕
      ctx.beginPath();
      ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
      ctx.fillStyle = COLORS.foodGlow;
      ctx.fill();

      // 果体：径向渐变从左上高光到主色
      const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
      g.addColorStop(0, COLORS.foodLight);
      g.addColorStop(1, COLORS.food);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      // 高光点
      ctx.beginPath();
      ctx.arc(cx - r * 0.32, cy - r * 0.38, r * 0.26, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.fill();
    }

    // 蛇身：沿中心点画粗线（圆头），逐段插值颜色，形成连续渐变体
    function drawSnake() {
      const len = snake.length;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = CELL - 3;
      for (let i = 0; i < len - 1; i++) {
        const t = (i + 1) / (len - 1); // 头端亮 → 尾端暗
        ctx.strokeStyle = lerpColor(COLORS.snake, COLORS.snakeTail, t);
        ctx.beginPath();
        ctx.moveTo(snake[i].x * CELL + CELL / 2, snake[i].y * CELL + CELL / 2);
        ctx.lineTo(snake[i + 1].x * CELL + CELL / 2, snake[i + 1].y * CELL + CELL / 2);
        ctx.stroke();
      }
      drawHead();
    }

    // 蛇头：更亮主色的圆角块 + 沿行进方向的两只眼睛
    function drawHead() {
      const head = snake[0];
      const px = head.x * CELL, py = head.y * CELL;

      roundedRectPath(px + 1, py + 1, CELL - 2, CELL - 2, 5);
      ctx.fillStyle = COLORS.head;
      ctx.fill();

      const cx = px + CELL / 2, cy = py + CELL / 2;
      const fx = direction.x, fy = direction.y;   // 前进方向
      const ox = -fy, oy = fx;                     // 与之垂直
      const forward = 4.5, side = 4.5, eyeR = 2.6, pupilR = 1.2;

      for (const s of [-1, 1]) {
        const ex = cx + fx * forward + ox * side * s;
        const ey = cy + fy * forward + oy * side * s;
        // 眼白
        ctx.beginPath();
        ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        // 瞳孔（略向前偏移，看向行进方向）
        ctx.beginPath();
        ctx.arc(ex + fx * 1.4, ey + fy * 1.4, pupilR, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
      }
    }

    // 十六进制颜色 → RGB（供渐变插值用）
    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    // 在 c1、c2 间线性插值，t ∈ [0,1]
    function lerpColor(c1, c2, t) {
      const a = hexToRgb(c1);
      const b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const bl = Math.round(a.b + (b.b - a.b) * t);
      return `rgb(${r}, ${g}, ${bl})`;
    }

    // ===== 持续渲染循环：状态由 step 定时更新，这里每帧重绘以驱动食物呼吸动画 =====
    function renderLoop(ts) {
      draw(ts);
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ===== 主题（深色 / 浅色）=====
    const THEMES = {
      dark: {
        gridAlt: '#1c2544',
        snake: '#4ade80',
        snakeTail: '#15803d',
        head: '#86efac',
        food: '#f87171',
        foodLight: '#fca5a5',
        foodGlow: 'rgba(248, 113, 113, 0.35)',
      },
      light: {
        gridAlt: '#eef2f7',
        snake: '#16a34a',
        snakeTail: '#166534',
        head: '#22c55e',
        food: '#ef4444',
        foodLight: '#fca5a5',
        foodGlow: 'rgba(239, 68, 68, 0.22)',
      },
    };

    // 安全读写 localStorage（隐私模式 / file:// 下可能不可用，避免抛异常导致脚本中断）
    function loadTheme() {
      try { return localStorage.getItem('snake-theme'); }
      catch { return null; }
    }

    function saveTheme(theme) {
      try { localStorage.setItem('snake-theme', theme); }
      catch { /* 存储不可用时静默失败，仅本次会话生效 */ }
    }

    function applyTheme(theme) {
      const isLight = theme === 'light';
      const t = THEMES[isLight ? 'light' : 'dark'];
      document.documentElement.dataset.theme = isLight ? 'light' : 'dark';
      Object.assign(COLORS, t);
      btnTheme.textContent = isLight ? '主题：浅色' : '主题：深色';
      saveTheme(isLight ? 'light' : 'dark');
      draw();
    }

    // ===== 按钮事件 =====
    btnPrimary.addEventListener('click', () => {
      if (state === 'paused') resume();
      else if (state === 'ready' || state === 'over' || state === 'win') start();
      btnPrimary.blur();
    });
    btnRestart.addEventListener('click', () => { start(); btnRestart.blur(); });
    btnRestartBar.addEventListener('click', () => { start(); btnRestartBar.blur(); });
    btnPause.addEventListener('click', () => { togglePause(); btnPause.blur(); });
    btnTheme.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      applyTheme(next);
      btnTheme.blur();
    });
    btnAi.addEventListener('click', () => {
      aiMode = !aiMode;
      btnAi.textContent = aiMode ? 'AI 演示：开' : 'AI 演示：关';
      btnAi.blur();
      if (aiMode && (state === 'ready' || state === 'over' || state === 'win')) start();
    });
    btnWinDec5.addEventListener('click', () => { setWinScore(winScore - 5); btnWinDec5.blur(); });
    btnWinDec1.addEventListener('click', () => { setWinScore(winScore - 1); btnWinDec1.blur(); });
    btnWinInc1.addEventListener('click', () => { setWinScore(winScore + 1); btnWinInc1.blur(); });
    btnWinInc5.addEventListener('click', () => { setWinScore(winScore + 5); btnWinInc5.blur(); });
    btnHistoryAll.addEventListener('click', () => {
      historyModal.classList.remove('hidden');
      btnHistoryAll.blur();
    });
    btnHistoryClose.addEventListener('click', () => historyModal.classList.add('hidden'));
    historyModal.addEventListener('click', (e) => {
      if (e.target === historyModal) historyModal.classList.add('hidden');
    });
    btnHistoryClear.addEventListener('click', () => {
      if (history.length === 0) { btnHistoryClear.blur(); return; }
      if (confirm('确定清空全部历史得分记录？')) {
        history = [];
        saveHistory();
        renderHistory();
      }
      btnHistoryClear.blur();
    });
    winInputEl.addEventListener('change', () => {
      const n = parseInt(winInputEl.value, 10);
      setWinScore(Number.isNaN(n) ? winScore : n);
    });
    document.querySelectorAll('.preset').forEach((btn) => {
      btn.addEventListener('click', () => {
        setWinScore(parseInt(btn.dataset.win, 10));
        btn.blur();
      });
    });

    // ===== 初始化：应用主题 + 恢复胜利目标 + 绘制静止画面 + 显示开始遮罩 =====
    applyTheme(loadTheme() || 'dark');
    const savedWin = loadWinScore();
    winScore = clampWin(Number.isFinite(savedWin) ? savedWin : WIN_DEFAULT);
    winInputEl.min = WIN_MIN;
    winInputEl.max = WIN_MAX;
    winInputEl.step = 1;
    winInputEl.value = winScore;
    renderState();
    renderHistory();
    renderValidity();
  </script>
</body>
</html>
